<div class="sec-hd">
  <div><p class="eyebrow">PLACE FINDER</p><h1>지역별 상견례 장소 찾기</h1><p>지도에서 지역을 누르면 직접 확인한 추천 장소와, 상견례에 잘 맞는 식당 유형별 지도 검색 바로가기를 보여 드려요. 양가 중간 지점을 먼저 정해 두면 고르기 쉬워요.</p></div>
</div>
<div class="place-grid">
  <div class="map-card">
    <div class="map-top"><b id="mapTitle">전국</b><button type="button" class="btn btn-sm btn-line" id="mapBack" hidden>← 전국 지도</button></div>
    <div id="tileWrap">
      <div class="tiles kr" id="tilesKr" role="group" aria-label="시도 선택"></div>
      <div class="tiles seoul" id="tilesSeoul" role="group" aria-label="서울 자치구 선택" hidden></div>
    </div>
    <div id="nmapWrap" hidden>
      <label class="sr" for="regionSelect">지역 고르기</label>
      <select class="inp" id="regionSelect"></select>
      <div class="nmap" id="nmap" role="region" aria-label="네이버 지도"></div>
    </div>
    <p class="map-hint" id="mapHint">실제 위치를 단순화한 타일 지도예요. 빨간 점이 있는 지역은 한 번 더 누르면 자세히 볼 수 있어요.</p>
  </div>
  <div class="result" id="placeResult">
    <div class="placeholder"><div><b style="display:block;color:var(--ink);font-size:17px;margin-bottom:6px">지역을 골라 주세요</b>양가가 오가기 편한 곳을 먼저 눌러 보세요.</div></div>
  </div>
</div>
