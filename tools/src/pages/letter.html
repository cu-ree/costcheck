<div class="sec-hd">
  <div><p class="eyebrow">HANDWRITTEN LETTER</p><h1>손편지 · 일러스트 양식</h1><p>받는 분과 시점을 고르면 편지 초안을 써 드려요. 문장을 고치면 편지지에 바로 반영되고, 이미지로 저장할 수 있어요.</p></div>
</div>
<div class="layout">
  <div class="panel">
    <div class="field"><span class="lab">편지지</span><div class="swatches" id="letterThemes"></div></div>
    <div class="field"><span class="lab" id="lToLab">받는 분</span>
      <div class="seg" role="group" aria-labelledby="lToLab"><button type="button" data-lto="in-law" aria-pressed="true">상대 부모님께</button><button type="button" data-lto="mine" aria-pressed="false">우리 부모님께</button></div>
    </div>
    <div class="field"><span class="lab" id="lWhenLab">시점</span>
      <div class="seg" role="group" aria-labelledby="lWhenLab"><button type="button" data-lwhen="before" aria-pressed="true">상견례 전</button><button type="button" data-lwhen="after" aria-pressed="false">상견례 후</button></div>
    </div>
    <div class="two">
      <div class="field"><label for="lFrom">보내는 사람</label><input class="inp" id="lFrom" value="은혜" maxlength="10"></div>
      <div class="field"><label for="lPartner">예비 배우자</label><input class="inp" id="lPartner" value="철수" maxlength="10"></div>
    </div>
    <div class="field"><label for="lCall">받는 분 호칭</label><input class="inp" id="lCall" value="아버님, 어머님" maxlength="16"></div>
    <div class="field"><label for="lBody">편지 내용</label><textarea class="inp" id="lBody" rows="10"></textarea></div>
    <div class="actions">
      <button type="button" class="btn btn-sm" id="letterPng">이미지 저장</button>
      <button type="button" class="btn btn-sm btn-line" id="letterDraft">초안 다시 쓰기</button>
      <button type="button" class="btn-ghost" id="letterPrint">인쇄</button>
    </div>
  </div>
  <div class="letter-paper sticky"><canvas id="letterCanvas" width="900" height="1200" aria-label="손편지 미리보기"></canvas></div>
</div>
