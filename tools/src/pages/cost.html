<a class="back" href="{{R}}">← 상견례 준비 전체 보기</a>
<div class="sec-hd">
  <div><p class="eyebrow">BUDGET</p><h1>상견례 비용 계산기</h1><p>인원과 코스 가격, 따로 붙는 비용을 넣으면 총액과 집안별 부담이 바로 나와요.</p></div>
  <button type="button" class="btn btn-sm btn-line" id="syncPeople">배치도 인원 불러오기</button>
</div>
<div class="cost-grid">
  <div class="panel">
    <div class="field"><span class="lab">참석 인원</span>
      <div class="stepper"><button type="button" id="pMinus" aria-label="한 명 줄이기">−</button><output id="pOut">6명</output><button type="button" id="pPlus" aria-label="한 명 늘리기">+</button></div>
    </div>
    <div class="field"><label for="course">1인 코스 가격 <output id="courseOut">6만 원</output></label>
      <input type="range" id="course" min="30000" max="200000" step="5000" value="60000">
      <div class="quick" id="courseQuick"><button type="button" data-v="40000">4만</button><button type="button" data-v="60000">6만</button><button type="button" data-v="80000">8만</button><button type="button" data-v="100000">10만</button><button type="button" data-v="150000">15만</button></div>
    </div>
    <div class="field"><label for="drink">1인 음료 · 주류 <output id="drinkOut">1만 원</output></label><input type="range" id="drink" min="0" max="50000" step="5000" value="10000"></div>
    <div class="two">
      <div class="field"><label for="room">룸 이용료 · 봉사료</label><input class="inp" id="room" inputmode="numeric" placeholder="0"></div>
      <div class="field"><label for="etc">주차 · 기타</label><input class="inp" id="etc" inputmode="numeric" placeholder="0"></div>
    </div>
    <div class="field"><label for="gift">선물 (한 집안 기준)</label><input class="inp" id="gift" inputmode="numeric" placeholder="0"></div>
    <div class="field"><span class="lab" id="splitLab">식사비는 누가 낼까요</span>
      <div class="seg" role="group" aria-labelledby="splitLab"><button type="button" data-split="couple" aria-pressed="true">예비부부</button><button type="button" data-split="half" aria-pressed="false">양가 반반</button><button type="button" data-split="groom" aria-pressed="false">신랑 측</button><button type="button" data-split="bride" aria-pressed="false">신부 측</button></div>
    </div>
  </div>
  <aside class="receipt" aria-live="polite">
    <p class="eyebrow">TOTAL</p>
    <p class="total" id="total">0원</p>
    <p class="total-sub" id="perHead">1인당 0원</p>
    <div class="bar" id="costBar"></div>
    <ul class="rows" id="costRows"></ul>
    <div class="split"><h4 id="splitTitle">부담 나누기</h4><div id="splitRows"></div></div>
    <small>실제 금액은 메뉴, 요일, 매장 조건에 따라 달라요. 예약 전에 코스 가격과 추가 비용을 꼭 확인하세요.</small>
  </aside>
</div>
